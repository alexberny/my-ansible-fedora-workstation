---

- name: 📦 Installa Zsh, Git e le dipendenze necessarie
  ansible.builtin.dnf:
    name:
      - zsh
      - git
      - curl
    state: present

- name: 🧑‍💻 Imposta Zsh come shell predefinita per l'utente
  ansible.builtin.user:
    name: "{{ user_name }}"
    shell: /bin/zsh

- name: 🦀 Installa il gestore plugin Sheldon (tramite script ufficiale)
  ansible.builtin.shell:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://github.io | bash -s -- --repo rossmacarthur/sheldon --to /usr/local/bin
    creates: /usr/local/bin/sheldon

- name: 📁 Crea le cartelle di configurazione per l'utente
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'
  loop:
    - "{{ user_home }}/.config/sheldon"
    - "{{ user_home }}/.config/zsh"

- name: ⚙️ Configura i plugin veloci in Sheldon (plugins.toml)
  ansible.builtin.copy:
    dest: "{{ user_home }}/.config/sheldon/plugins.toml"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
    content: |
      shell = "zsh"

      [plugins.zsh-defer]
      github = "romkatv/zsh-defer"

      [plugins.powerlevel10k]
      github = "romkatv/powerlevel10k"

      [plugins.ohmyzsh-git]
      github = "ohmyzsh/ohmyzsh"
      dir = "plugins/git"

      [plugins.zsh-autosuggestions]
      github = "zsh-users/zsh-autosuggestions"
      use = ["{% raw %}{{ name }}{% endraw %}.zsh"]
      apply = ["defer"]

      [plugins.zsh-syntax-highlighting]
      github = "zsh-users/zsh-syntax-highlighting"
      apply = ["defer"]

- name: 📝 Genera il nuovo file .zshrc ultra-veloce
  ansible.builtin.copy:
    dest: "{{ user_home }}/.zshrc"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
    content: |
      # Abilita l'avvio istantaneo di Powerlevel10k
      if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
        source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
      fi

      # Inizializza i plugin caricati da Sheldon
      eval "$(sheldon source)"

      # Carica la configurazione grafica di P10k se esiste
      [[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh

      # Alias utili per DNF
      alias dnfi="sudo dnf install"
      alias dnfu="sudo dnf upgrade"
      alias dnfr="sudo dnf remove"
